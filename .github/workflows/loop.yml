name: AutoResearchClaw Loop

on:
  schedule:
    # Every 48 hours at 09:00 UTC. Scheduled runs are always dry: they prove
    # the pipeline is wired without touching Meta.
    - cron: '0 9 */2 * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no Meta API calls, no spend). Uncheck for a live cycle.'
        required: false
        default: 'true'
        type: boolean
      step:
        description: 'Run a single step only (full = whole loop)'
        required: false
        default: 'full'
        type: choice
        options:
          - full
          - harvest
          - analyze
          - generate
          - deploy

permissions:
  contents: write

jobs:
  run-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r loop/requirements.txt

      - name: Repair angle-fatigue intel loader
        # One-shot repair. load_intel_from_baserow() imported a BaserowClient
        # class that baserow_sink never exported, so every cycle logged
        # "Baserow load failed" and fell back to local files. Rewrite the
        # function to use baserow_sink.read_intel_ads(), verify it, then
        # commit. Idempotent: skips when the reader is already in use.
        run: |
          python - <<'PY'
          import pathlib
          import re

          path = pathlib.Path("loop/scripts/angle_fatigue.py")
          src = path.read_text()

          if "read_intel_ads" in src:
              print("angle-fatigue loader already uses read_intel_ads")
              raise SystemExit(0)

          match = re.search(r"def load_intel_from_baserow\(.*?(?=\ndef |\Z)", src, re.S)
          if not match:
              raise SystemExit("could not find load_intel_from_baserow()")
          old = match.group(0)

          fallback = re.search(r"return\s+(\w+)\(", old)
          if not fallback:
              raise SystemExit("could not find the local fallback call")
          fallback_name = fallback.group(1)

          NEW = '''def load_intel_from_baserow(config: dict, niche: str = "") -> list[dict]:
              """
              Load intel ads for fatigue analysis.

              Baserow is the memory layer, but a read only helps when the rows
              carry the advertiser field the diversity score needs -
              read_intel_ads() returns nothing otherwise. Either way we fall
              back to the local harvest files, which carry that field.
              """
              if config.get("baserow", {}).get("enabled"):
                  try:
                      from baserow_sink import read_intel_ads
                      rows = read_intel_ads(config, niche)
                  except Exception as e:
                      print(f"[FATIGUE] Baserow load failed ({e}), falling back to local files")
                      rows = []
                  if rows:
                      return rows
              return __FALLBACK__(niche)
          '''

          new = NEW.replace("__FALLBACK__", fallback_name)
          path.write_text(src[: match.start()] + new + src[match.end() :])
          print("rewrote load_intel_from_baserow; local fallback:", fallback_name)
          PY
          python -c "import ast,pathlib; ast.parse(pathlib.Path('loop/scripts/angle_fatigue.py').read_text()); print('angle_fatigue.py parses')"
          (cd loop && python scripts/test_angle_fatigue_loader.py)
          git config --local user.email "autoResearchClaw@github-actions"
          git config --local user.name "AutoResearchClaw"
          git add loop/scripts/angle_fatigue.py
          if git diff --staged --quiet; then
            echo "nothing to repair"
          else
            git commit -m "fix(loop): load intel_ads through baserow_sink.read_intel_ads"
            git pull --rebase origin main
            git push
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Parser regression check
        # The challenger brief is parsed by deploy.py before anything is
        # published to Meta. A parser that silently returns empty/garbled
        # fields would ship a broken ad, so it is gated here.
        working-directory: loop
        run: python scripts/test_deploy_parser.py

      - name: Angle-fatigue loader check
        # The fatigue scorer reads intel_ads through baserow_sink. A loader
        # whose reader cannot be imported falls back to local files silently,
        # so the dead import path is gated here.
        working-directory: loop
        run: python scripts/test_angle_fatigue_loader.py

      - name: Write config from secrets
        # loop/config/config.yaml.example is the single source of truth for the
        # loop's config schema. Copy it, then inject only the secrets, so CI
        # can never drift from the local schema.
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_AD_ACCOUNT_ID: ${{ secrets.META_AD_ACCOUNT_ID }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          OFFER_NAME: ${{ secrets.OFFER_NAME }}
          OFFER_NICHE: ${{ secrets.OFFER_NICHE }}
          TARGET_CPA: ${{ secrets.TARGET_CPA }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: |
          mkdir -p loop/config
          python - <<'PY'
          import os
          import pathlib
          import yaml

          src = pathlib.Path("loop/config/config.yaml.example")
          dst = pathlib.Path("loop/config/config.yaml")
          cfg = yaml.safe_load(src.read_text())

          env = {k: os.environ.get(k, "").strip() for k in os.environ}


          def substitute(node):
              """Replace ${SECRET} placeholders with the secret's value."""
              if isinstance(node, dict):
                  return {k: substitute(v) for k, v in node.items()}
              if isinstance(node, list):
                  return [substitute(v) for v in node]
              if isinstance(node, str):
                  for name, value in env.items():
                      token = "${" + name + "}"
                      if value and token in node:
                          node = node.replace(token, value)
              return node


          cfg = substitute(cfg)


          def put(section, key, value):
              if value:
                  cfg.setdefault(section, {})[key] = value


          put("meta", "access_token", env["META_ACCESS_TOKEN"])
          put("meta", "ad_account_id", env["META_AD_ACCOUNT_ID"])
          put("meta", "app_id", env["META_APP_ID"])
          put("meta", "app_secret", env["META_APP_SECRET"])
          put("meta", "page_id", env["META_PAGE_ID"])
          put("notifications", "slack_webhook", env["SLACK_WEBHOOK_URL"])
          put("offer", "name", env["OFFER_NAME"])
          put("offer", "niche", env["OFFER_NICHE"])
          put("tavily", "api_key", env["TAVILY_API_KEY"])
          if env["TARGET_CPA"]:
              cfg.setdefault("offer", {})["target_cpa"] = float(env["TARGET_CPA"])

          # LLM: prefer the Anthropic key, else the MiniMax Anthropic-compatible
          # endpoint. Model and base_url come as a pair - a claude-* model name
          # is rejected by the MiniMax endpoint.
          if env["ANTHROPIC_API_KEY"]:
              cfg.setdefault("llm", {})["api_key"] = env["ANTHROPIC_API_KEY"]
          elif env["MINIMAX_API_KEY"]:
              cfg.setdefault("llm", {}).update({
                  "api_key": env["MINIMAX_API_KEY"],
                  "base_url": "https://api.minimax.io/anthropic",
                  "model": "MiniMax-M2.5-highspeed",
              })

          dst.write_text(yaml.safe_dump(cfg, sort_keys=False, allow_unicode=True))
          print("wrote", dst)
          PY
          echo "--- credential status ---"
          echo "META_ACCESS_TOKEN: $([ -n "$META_ACCESS_TOKEN" ] && echo set || echo MISSING)"
          echo "META_AD_ACCOUNT_ID: $([ -n "$META_AD_ACCOUNT_ID" ] && echo set || echo MISSING)"
          echo "LLM key: $([ -n "$ANTHROPIC_API_KEY$MINIMAX_API_KEY" ] && echo set || echo MISSING)"
          echo "TAVILY_API_KEY: $([ -n "$TAVILY_API_KEY" ] && echo set || echo MISSING)"

      - name: Run AutoResearchClaw
        working-directory: loop
        env:
          META_ADSET_ID: ${{ secrets.META_ADSET_ID }}
          META_IMAGE_HASH: ${{ secrets.META_IMAGE_HASH }}
          OFFER_LINK_URL: ${{ secrets.OFFER_LINK_URL }}
        run: |
          # Scheduled runs stay dry. A live cycle only happens when someone
          # dispatches the workflow with dry_run unchecked - that click is the
          # human approval step before any Meta spend.
          DRY="--dry-run"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" != "true" ]; then
            DRY=""
          fi

          STEP_ARG=""
          if [ -n "${{ inputs.step }}" ] && [ "${{ inputs.step }}" != "full" ]; then
            STEP_ARG="--step ${{ inputs.step }}"
          fi

          python orchestrator/orchestrator.py \
            $STEP_ARG \
            $DRY \
            --adset-id "$META_ADSET_ID" \
            --image-hash "$META_IMAGE_HASH" \
            --link-url "${OFFER_LINK_URL:-https://example.com}"

      - name: Commit learnings
        # Only live cycles produce learnings worth keeping; a dry run emits
        # mock briefs that would poison the next real cycle. dry_run is a
        # boolean input, so compare it to false - comparing it to the string
        # 'true' is always true and let dry runs commit mock learnings.
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.dry_run == false }}
        run: |
          mkdir -p loop/learnings
          git config --local user.email "autoResearchClaw@github-actions"
          git config --local user.name "AutoResearchClaw"
          git add -A loop/ || true
          if git diff --staged --quiet; then
            echo "no learnings to commit"
          else
            git commit -m "chore(loop): AutoResearchClaw cycle $(date -u +%Y-%m-%d_%H%M)"
            git pull --rebase origin main && git push || echo "::warning::could not push learnings"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
